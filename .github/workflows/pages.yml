name: Deploy site (GitHub Pages)

# Publie le dossier site/ (vitrine + terminal statiques) sur GitHub Pages.
# Pages activé le 17/11/2026 (Settings → Pages → Source : « GitHub Actions »).
# Le site est republié après chaque passage hebdomadaire réussi, ou à la main.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["RubberSignal Weekly Pipeline"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Après un passage hebdomadaire : seulement s'il a réussi (garde licence comprise).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions épinglées par empreinte de commit, toutes en Node 24.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
