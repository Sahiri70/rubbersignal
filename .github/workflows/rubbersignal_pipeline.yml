name: RubberSignal Weekly Pipeline

on:
  schedule:
    # Lundi 04:23 UTC. Les tâches programmées à l'heure pile sont retardées de
    # plusieurs heures par GitHub (5 à 8 h constatées) : minute décalée.
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Droits minimaux : le robot ne peut qu'écrire dans le dépôt (commit des rapports).
permissions:
  contents: write

# Un seul passage à la fois : pas de commits concurrents du robot.
concurrency:
  group: rubbersignal-pipeline
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Décision D1 (03/11/2026) : pas de cotation sous licence (MRB/SGX via rtas.sg)
  # dans les rapports publiés tant qu'aucune autorisation écrite n'est obtenue.
  # Passer à "TRUE" seulement avec l'accord écrit de la source.
  RS_PUBLIER_SOURCES_SOUS_LICENCE: "FALSE"
  # Paquets R figés à une date (reproductible) : changer la date pour mettre à jour.
  RS_CRAN_SNAPSHOT: "https://packagemanager.posit.co/cran/__linux__/jammy/2026-11-09"

jobs:
  generate-report:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:

      # Actions épinglées par empreinte de commit (pas de version flottante).
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)

      - name: Setup R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: "4.4.0"
          use-public-rspm: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('httr','jsonlite','tidyverse','lubridate','rvest','readxl','testthat'), repos=Sys.getenv('RS_CRAN_SNAPSHOT'), dependencies=TRUE)"

      - name: Create directories
        run: |
          mkdir -p data/raw
          mkdir -p data/processed
          mkdir -p output

      # Tests hors ligne, sans clé. Bloquants depuis le premier passage vert sur
      # GitHub (17/11/2026, passages 42 et 45) : un code cassé arrête le passage
      # avant toute collecte, rien n'est publié.
      - name: Run tests (offline)
        run: |
          Rscript tests/run_all.R || { echo "::error::Tests en echec, rien n'est publie. Voir le journal de cette etape"; exit 1; }

      - name: Run Script 01 - Collect prices
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: Rscript scripts/01_collect_prices.R

      - name: Run Script 02 - Collect news (RSS feeds)
        # Flux RSS publics (data/reference/sources_actualites.csv) : aucune cle
        run: Rscript scripts/02_collect_news.R

      - name: Run Script 04 - Collect signals
        env:
          EXCHANGERATE_KEY: ${{ secrets.EXCHANGERATE_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: Rscript scripts/04_collect_signals.R

      - name: Run Script 05 - Simulate Thompson
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: Rscript scripts/05_simulate.R

      - name: Run Script 06 - EU customs (Eurostat Comext, RAPI-CI)
        # API publiques sans cle (Eurostat, BCE) ; FRED seulement si la BCE echoue
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: Rscript scripts/06_collect_trade.R

      - name: Run Script 06b - EU customs, other African origins (RAPI-Afrique)
        # Liberia, Ghana, Nigeria, Cameroun : meme API publique sans cle ;
        # taux USD/EUR repris de la base (ecrits par le script 06)
        run: Rscript scripts/06b_collect_afrique.R

      - name: Run Script 09 - FAOSTAT annual production
        # Fichiers en vrac FAO sans cle ; telecharges seulement si la FAO a publie
        run: Rscript scripts/09_collect_faostat.R

      - name: Run Script 03 - Build report
        run: Rscript scripts/03_build_report.R

      - name: Run Script 08 - Export public site data
        # Données du site vitrine et du terminal : séries publiables seulement, aucune clé.
        run: Rscript scripts/08_export_site.R

      - name: Run Script 07 - Licence guard (blocks publication)
        # Retire des fichiers publics les valeurs sous licence (decision D1) ;
        # arrete le passage si une valeur subsiste : rien n'est commite.
        run: Rscript scripts/07_garde_licence.R

      - name: Commit and push reports
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "RubberSignal Bot"
          git add output/ data/ site/data/
          git diff --staged --quiet && { echo "Rien de nouveau à publier."; exit 0; }
          git commit -m "RubberSignal auto S$(date +'%V') $(date +'%Y')"
          # Si le dépôt a avancé entre-temps : rejouer le commit par-dessus, sinon échouer clairement.
          git pull --rebase origin master
          git push
