name: RubberSignal Weekly Pipeline

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-report:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('httr','jsonlite','tidyverse','lubridate','rvest'), repos='https://packagemanager.posit.co/cran/__linux__/jammy/latest', dependencies=TRUE)"

      - name: Create directories
        run: |
          mkdir -p data/raw
          mkdir -p data/processed
          mkdir -p output

      - name: Run Script 01 - Collect prices
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: Rscript scripts/01_collect_prices.R

      - name: Run Script 02 - Collect news
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: Rscript scripts/02_collect_news.R

      - name: Run Script 04 - Collect signals
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          EXCHANGERATE_KEY: ${{ secrets.EXCHANGERATE_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: Rscript scripts/04_collect_signals.R

      - name: Run Script 05 - Simulate Thompson
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: Rscript scripts/05_simulate.R

      - name: Run Script 03 - Build report
        run: Rscript scripts/03_build_report.R

      - name: Commit and push reports
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "RubberSignal Bot"
          git add output/
          git add data/
          git diff --staged --quiet || git commit -m "RubberSignal auto S$(date +'%V') $(date +'%Y')"
          git pull --rebase origin master || true
          git push

